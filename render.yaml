services:
  - type: web
    name: ecomzone-web
    runtime: node
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
    disk:
      name: uploads
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 10
